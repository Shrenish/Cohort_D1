<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        .container{
            width: 400px;
            margin: 80px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input, select{
            width: 100%;
            padding: 8px;
            margin: 8px 0;
        }
        button{
            width: 100%;
            padding: 10px;
            background: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover{
            background: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Register</h2>
    
    <form action="/register" method="POST">
        
        <label>Name</label>
        <input type="text" name="name" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <label>Role</label>
        <select name="role">
            <option value="1">Student</option>
            <option value="2">Admin</option>
            <option value="3">Seller</option>
        </select>

        <button type="submit">Sign Up</button>

    </form>
</div>
</body>
</html>
