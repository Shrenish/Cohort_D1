    <!DOCTYPE html>
<html>
<head>
<title>Student Registration Form for college</title>

<style>
body{
    font-family: Arial;
    background: color #f2f2f1;;
}

.container{
    width:400px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:8px;
    box-shadow:0px 0px 10px gray;
}

h2{
    text-align:center;
}

input, select, textarea{
    width:100%;
    padding:8px;
    margin-top:5px;
    margin-bottom:10px;
}

button{
    padding:10px;
    width:48%;
    border:none;
    background:#4CAF50;
    color:white;
    cursor:pointer;
}

.reset{
    background:red;
}
</style>

</head>

<body>

<div class="container">

<h2>Student Registration Form</h2>

<form>

<label>Name</label>
<input type="text" placeholder="Enter your name">

<label>Email</label>
<input type="email" placeholder="Enter your email">

<label>Password</label>
<input type="password" placeholder="Enter password">

<label>Gender</label><br>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<br><br>

<label>Course</label>
<select>
<option>BCA</option>
<option>BSc</option>
<option>BTech</option>
<option>Civil Engineering</option>
</select>

<label>Address</label>
<textarea rows="3"></textarea>

<button type="submit">Submit</button>
<button type="reset" class="reset">Reset</button>

</form>

</div>

</body>
</html>
